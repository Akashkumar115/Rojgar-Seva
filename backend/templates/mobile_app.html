<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rozgar Seva (रोजगार सेवा) - Web Mobile Simulator</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0F5257;
      --secondary: #0B6E4F;
      --accent: #E6AF2E;
      --bg-dark: #0D1117;
      --app-bg: #F8F9FA;
      --card-bg: #FFFFFF;
      --text-main: #1A1D20;
      --text-muted: #6C757D;
      --border-color: #E9ECEF;
      --success: #28A745;
      --warning: #FD7E14;
      --danger: #DC3545;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

    body {
      background: linear-gradient(135deg, #0b1320 0%, #152238 50%, #0d1b2a 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #fff;
    }

    /* Outer Control Toolbar */
    .top-toolbar {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 20px;
      background: rgba(255, 255, 255, 0.08);
      padding: 10px 20px;
      border-radius: 40px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      flex-wrap: wrap;
      justify-content: center;
    }

    .toolbar-title { font-weight: 800; font-size: 16px; color: var(--accent); display: flex; align-items: center; gap: 8px; }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 10px #22c55e; }

    .btn-toggle {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      transition: all 0.2s;
    }

    .btn-toggle:hover, .btn-toggle.active {
      background: var(--secondary);
      box-shadow: 0 4px 12px rgba(11, 110, 79, 0.4);
    }

    /* Mobile Device Frame Mockup */
    .phone-container {
      width: 410px;
      height: 840px;
      background: #000;
      border-radius: 50px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 0 12px #22252a, 0 0 0 14px #3b3f46;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: all 0.3s ease;
    }

    .phone-container.fullscreen {
      width: 100%;
      max-width: 600px;
      height: 90vh;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }

    /* Dynamic Island Notch */
    .phone-notch {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 28px;
      background: #000;
      border-radius: 20px;
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 10px;
    }
    .notch-camera { width: 10px; height: 10px; border-radius: 50%; background: #111; border: 1px solid #222; }

    /* Mobile Screen Content */
    .app-screen {
      flex: 1;
      background: var(--app-bg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      margin-top: 0px;
      position: relative;
    }

    /* Header Bar */
    .app-header {
      background: var(--primary);
      color: #fff;
      padding: 42px 18px 16px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .app-brand { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }
    .role-badge { background: var(--accent); color: #1a1d20; padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 800; }

    /* Content Body */
    .app-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }

    /* Bottom Navigation Bar */
    .app-tabbar {
      height: 65px;
      background: #ffffff;
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-around;
      align-items: center;
    }
    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      gap: 3px;
      transition: color 0.2s;
    }
    .tab-item.active { color: var(--secondary); font-weight: 800; }
    .tab-icon { font-size: 20px; }

    /* UI Components */
    .card {
      background: #fff;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
      border: 1px solid var(--border-color);
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      color: var(--text-main);
    }

    .card-title { font-size: 16px; font-weight: 700; color: var(--text-main); }
    .wage-tag { font-size: 18px; font-weight: 800; color: var(--primary); }
    .subtext { font-size: 13px; color: var(--text-muted); }

    .badge-escrow {
      background: #FFF9DB;
      color: #F59F00;
      font-weight: 700;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 6px;
      display: inline-block;
    }

    .btn {
      width: 100%;
      background: var(--secondary);
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    .btn-secondary { background: var(--primary); }
    .btn-outline { background: transparent; border: 1px solid var(--border-color); color: var(--text-main); }

    /* Auth Screens */
    .auth-box { padding: 24px; text-align: center; }
    .input-field {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      margin-bottom: 12px;
      font-size: 14px;
    }

    .demo-btn-group { display: flex; gap: 8px; margin-top: 14px; }
    .demo-btn { flex: 1; padding: 10px; border-radius: 8px; font-weight: 700; font-size: 12px; cursor: pointer; border: 1px solid #ddd; }
    .demo-worker { background: #E8F5E9; color: #1b5e20; }
    .demo-employer { background: #E3F2FD; color: #0d47a1; }

    /* Category Chips */
    .chip-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 14px; }
    .chip { background: #E9ECEF; color: var(--text-main); padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; white-space: nowrap; cursor: pointer; }
    .chip.active { background: var(--primary); color: #fff; }
  </style>
</head>
<body>

  <!-- Outer Control Bar -->
  <div class="top-toolbar">
    <div class="toolbar-title">
      <span class="status-dot"></span> Rozgar Seva Web Simulator
    </div>
    <button class="btn-toggle active" id="modeWorker" onclick="switchRole('WORKER')">👷 Worker Mode</button>
    <button class="btn-toggle" id="modeEmp" onclick="switchRole('EMPLOYER')">🏗️ Employer Mode</button>
    <button class="btn-toggle" id="modeAdmin" onclick="switchRole('ADMIN')">🛡️ Admin Mode</button>
    <button class="btn-toggle" onclick="toggleFrame()">📱 Toggle Device Frame</button>
  </div>

  <!-- Mobile Phone Mockup -->
  <div class="phone-container" id="phoneContainer">
    <div class="phone-notch">
      <div class="notch-camera"></div>
    </div>

    <div class="app-screen">
      <!-- App Header -->
      <div class="app-header">
        <div class="app-brand">Rozgar Seva</div>
        <div class="role-badge" id="currentRoleBadge">WORKER VIEW</div>
      </div>

      <!-- Main Body View Container -->
      <div class="app-body" id="appBody">
        <!-- Rendered dynamically by JS -->
      </div>

      <!-- Bottom Tab Bar -->
      <div class="app-tabbar" id="appTabbar">
        <!-- Rendered dynamically by JS -->
      </div>
    </div>
  </div>

  <script>
    const API_BASE = 'http://127.0.0.1:8000/api';
    let currentUser = null;
    let currentRole = 'WORKER';
    let currentTab = 'home';
    let categories = [];
    let jobs = [];

    // Initialize App
    window.onload = async () => {
      await fetchCategories();
      await autoDemoLogin('WORKER');
    };

    function toggleFrame() {
      document.getElementById('phoneContainer').classList.toggle('fullscreen');
    }

    async function switchRole(role) {
      currentRole = role;
      document.querySelectorAll('.btn-toggle').forEach(b => b.classList.remove('active'));
      if (role === 'WORKER') document.getElementById('modeWorker').classList.add('active');
      if (role === 'EMPLOYER') document.getElementById('modeEmp').classList.add('active');
      if (role === 'ADMIN') document.getElementById('modeAdmin').classList.add('active');
      
      document.getElementById('currentRoleBadge').innerText = role + ' VIEW';

      if (role === 'WORKER') await autoDemoLogin('WORKER');
      else if (role === 'EMPLOYER') await autoDemoLogin('EMPLOYER');
      else await autoDemoLogin('ADMIN');
    }

    async function autoDemoLogin(role) {
      let phone = '9123456780';
      let pass = 'worker123';
      if (role === 'EMPLOYER') { phone = '9876543210'; pass = 'emp123'; }
      if (role === 'ADMIN') { phone = '9999999999'; pass = 'admin123'; }

      try {
        const res = await fetch(`${API_BASE}/auth/login/`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone_number: phone, password: pass })
        });
        const data = await res.json();
        if (data.access) {
          localStorage.setItem('access_token', data.access);
          currentUser = data.user;
          renderApp();
        }
      } catch (err) {
        console.error('Auto login failed:', err);
      }
    }

    async function fetchCategories() {
      try {
        const res = await fetch(`${API_BASE}/jobs/categories/`);
        categories = await res.json();
      } catch(e) {}
    }

    async function renderApp() {
      renderTabbar();
      if (currentRole === 'WORKER') {
        if (currentTab === 'home') await renderWorkerHome();
        else if (currentTab === 'apps') await renderWorkerApplications();
        else if (currentTab === 'earnings') await renderWorkerEarnings();
      } else if (currentRole === 'EMPLOYER') {
        if (currentTab === 'home') await renderEmployerDashboard();
        else if (currentTab === 'post') renderPostJobForm();
      } else if (currentRole === 'ADMIN') {
        await renderAdminDashboard();
      }
    }

    function renderTabbar() {
      const tabbar = document.getElementById('appTabbar');
      if (currentRole === 'WORKER') {
        tabbar.innerHTML = `
          <div class="tab-item ${currentTab==='home'?'active':''}" onclick="setTab('home')">
            <span class="tab-icon">🔎</span> Jobs
          </div>
          <div class="tab-item ${currentTab==='apps'?'active':''}" onclick="setTab('apps')">
            <span class="tab-icon">📋</span> Applications
          </div>
          <div class="tab-item ${currentTab==='earnings'?'active':''}" onclick="setTab('earnings')">
            <span class="tab-icon">💰</span> Earnings
          </div>
        `;
      } else if (currentRole === 'EMPLOYER') {
        tabbar.innerHTML = `
          <div class="tab-item ${currentTab==='home'?'active':''}" onclick="setTab('home')">
            <span class="tab-icon">📊</span> Dashboard
          </div>
          <div class="tab-item ${currentTab==='post'?'active':''}" onclick="setTab('post')">
            <span class="tab-icon">➕</span> Post Job
          </div>
        `;
      } else {
        tabbar.innerHTML = `
          <div class="tab-item active">
            <span class="tab-icon">🛡️</span> System Admin Metrics
          </div>
        `;
      }
    }

    function setTab(tab) {
      currentTab = tab;
      renderApp();
    }

    // 👷 Worker Home
    async function renderWorkerHome() {
      const body = document.getElementById('appBody');
      const token = localStorage.getItem('access_token');
      const res = await fetch(`${API_BASE}/jobs/?status=OPEN`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      const data = await res.json();
      jobs = data.results || data;

      let html = `
        <div style="margin-bottom:12px">
          <h3 style="font-weight:800">Namaste, ${currentUser?.full_name || 'Worker'} 👋</h3>
          <p class="subtext">Find Daily Work. Earn Guaranteed Wages.</p>
        </div>

        <div class="chip-scroll">
          <div class="chip active">All Jobs</div>
          ${categories.map(c => `<div class="chip">${c.name}</div>`).join('')}
        </div>
      `;

      jobs.forEach(job => {
        html += `
          <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <span class="badge-escrow">🔒 Escrow Protected</span>
              <span class="wage-tag">₹${job.payment_amount} <small style="font-size:11px; font-weight:normal;">/day</small></span>
            </div>
            <div class="card-title" style="margin-top:6px;">${job.title}</div>
            <div class="subtext" style="margin-top:4px;">📍 ${job.location} | 📅 ${job.work_date}</div>
            <div style="margin-top:10px;">
              <button class="btn" onclick="applyJob(${job.id})">APPLY FOR THIS JOB</button>
            </div>
          </div>
        `;
      });

      body.innerHTML = html;
    }

    async function applyJob(jobId) {
      const token = localStorage.getItem('access_token');
      const res = await fetch(`${API_BASE}/applications/apply/${jobId}/`, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ cover_note: "Ready for immediate daily wage work." })
      });
      const data = await res.json();
      if (res.ok) {
        alert('Application Submitted 🎉');
        setTab('apps');
      } else {
        alert(data.error || 'Failed to apply.');
      }
    }

    // 📋 Worker Applications & GPS Verification
    async function renderWorkerApplications() {
      const body = document.getElementById('appBody');
      const token = localStorage.getItem('access_token');
      const res = await fetch(`${API_BASE}/applications/my-applications/`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      const apps = await res.json();

      let html = `<h3 style="margin-bottom:12px; font-weight:800;">My Applications</h3>`;
      (apps.results || apps).forEach(app => {
        html += `
          <div class="card">
            <div style="display:flex; justify-content:space-between;">
              <div class="card-title">${app.job_title}</div>
              <span class="badge-escrow" style="background:#D3F9D8; color:#0B6E4F;">${app.status}</span>
            </div>
            <div class="subtext" style="margin-top:4px;">💰 ₹${app.job_payment_amount} | 📍 ${app.job_location}</div>
            ${app.status === 'ACCEPTED' ? `
              <button class="btn" style="margin-top:10px; background:var(--primary);" onclick="verifyGPS(${app.job})">
                📍 Verify GPS Location at Job Site
              </button>
            ` : ''}
          </div>
        `;
      });
      body.innerHTML = html;
    }

    async function verifyGPS(jobId) {
      const token = localStorage.getItem('access_token');
      const res = await fetch(`${API_BASE}/verification/submit/${jobId}/`, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ latitude: 28.6315, longitude: 77.2167, notes: "Arrived at job site." })
      });
      const data = await res.json();
      if (data.is_verified) {
        alert('GPS Location Verified! ✅ Work status is now IN_PROGRESS.');
        renderApp();
      } else {
        alert(data.message);
      }
    }

    // 💰 Worker Earnings
    async function renderWorkerEarnings() {
      const body = document.getElementById('appBody');
      const token = localStorage.getItem('access_token');
      const res = await fetch(`${API_BASE}/payments/worker-earnings/`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      const data = await res.json();

      body.innerHTML = `
        <div class="card" style="background:var(--primary); color:#fff;">
          <div style="font-size:12px; color:var(--accent); font-weight:700;">TOTAL NET EARNINGS</div>
          <div style="font-size:36px; font-weight:800; margin:6px 0;">₹${data.total_earnings || 0}</div>
          <div class="subtext" style="color:rgba(255,255,255,0.8);">Completed Jobs: ${data.completed_jobs_count || 0} | 100% Escrow Guaranteed</div>
        </div>
        <h4 style="margin:12px 0;">Escrow Payment Ledger</h4>
        ${(data.history || []).map(h => `
          <div class="card">
            <div style="display:flex; justify-content:space-between;">
              <span style="font-weight:700;">${h.job_title}</span>
              <span style="font-weight:800; color:var(--secondary);">+₹${h.net_amount}</span>
            </div>
            <div class="subtext" style="margin-top:4px;">Gross: ₹${h.amount} (5% fee: -₹${h.platform_fee})</div>
          </div>
        `).join('')}
      `;
    }

    // 🏗️ Employer Dashboard
    async function renderEmployerDashboard() {
      const body = document.getElementById('appBody');
      const token = localStorage.getItem('access_token');
      const res = await fetch(`${API_BASE}/jobs/my-posted/`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      const myJobs = await res.json();

      let html = `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
          <h3 style="font-weight:800;">Employer Dashboard</h3>
          <button class="btn" style="width:auto; padding:6px 14px;" onclick="setTab('post')">➕ Post Job</button>
        </div>
      `;

      (myJobs.results || myJobs).forEach(job => {
        html += `
          <div class="card">
            <div class="card-title">${job.title}</div>
            <div class="subtext">💰 Wage: ₹${job.payment_amount} | Status: <b>${job.status}</b></div>
            <div style="margin-top:10px; display:flex; gap:8px;">
              <button class="btn btn-outline" onclick="viewApplicants(${job.id})">View Applicants (${job.applications_count})</button>
              ${job.selected_worker && job.status !== 'COMPLETED' ? `
                <button class="btn" style="background:var(--accent); color:#000;" onclick="releaseEscrow(${job.id})">🔒 Release Escrow</button>
              ` : ''}
            </div>
          </div>
        `;
      });
      body.innerHTML = html;
    }

    // ➕ Post Job Form
    function renderPostJobForm() {
      const body = document.getElementById('appBody');
      body.innerHTML = `
        <h3 style="margin-bottom:12px; font-weight:800;">Post a New Daily Job</h3>
        <div class="card">
          <label style="font-size:12px; font-weight:700;">Job Title</label>
          <input type="text" id="postTitle" class="input-field" placeholder="e.g. Electrician Wiring Repair">

          <label style="font-size:12px; font-weight:700;">Daily Wage (₹)</label>
          <input type="number" id="postWage" class="input-field" placeholder="e.g. 850">

          <label style="font-size:12px; font-weight:700;">Location</label>
          <input type="text" id="postLocation" class="input-field" value="Connaught Place, New Delhi">

          <label style="font-size:12px; font-weight:700;">Job Description</label>
          <textarea id="postDesc" class="input-field" style="height:70px;" placeholder="Work description..."></textarea>

          <button class="btn" onclick="submitNewJob()">🔒 POST JOB WITH ESCROW</button>
        </div>
      `;
    }

    async function submitNewJob() {
      const token = localStorage.getItem('access_token');
      const title = document.getElementById('postTitle').value;
      const wage = document.getElementById('postWage').value;
      const loc = document.getElementById('postLocation').value;
      const desc = document.getElementById('postDesc').value;

      const res = await fetch(`${API_BASE}/jobs/`, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({
          category: categories[0]?.id || 1,
          title: title,
          description: desc,
          location: loc,
          latitude: 28.6315,
          longitude: 77.2167,
          payment_amount: parseFloat(wage),
          work_date: new Date().toISOString().split('T')[0]
        })
      });

      if (res.ok) {
        alert('Job Posted Successfully with Escrow Record! 🎉');
        setTab('home');
      } else {
        alert('Failed to post job.');
      }
    }

    async function viewApplicants(jobId) {
      const token = localStorage.getItem('access_token');
      const res = await fetch(`${API_BASE}/applications/job/${jobId}/`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      const data = await res.json();
      const body = document.getElementById('appBody');

      let html = `<button class="btn btn-outline" onclick="setTab('home')" style="margin-bottom:10px;">← Back to Dashboard</button>`;
      html += `<h4>Applicants for Job</h4>`;

      (data.results || data).forEach(app => {
        html += `
          <div class="card">
            <div style="font-weight:700;">👷 ${app.worker_name}</div>
            <div class="subtext">⭐ Rating: ${app.worker_rating} / 5.0</div>
            <div style="font-style:italic; margin:6px 0;">"${app.cover_note}"</div>
            ${app.status === 'PENDING' ? `
              <button class="btn" onclick="acceptWorker(${app.id})">ACCEPT WORKER & LOCK ESCROW 🔒</button>
            ` : `
              <div class="badge-escrow" style="margin-top:6px;">Status: ${app.status}</div>
            `}
          </div>
        `;
      });
      body.innerHTML = html;
    }

    async function acceptWorker(appId) {
      const token = localStorage.getItem('access_token');
      const res = await fetch(`${API_BASE}/applications/${appId}/accept/`, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${token}` }
      });
      if (res.ok) {
        alert('Worker Accepted & Escrow Status set to HELD 🔒');
        setTab('home');
      }
    }

    async function releaseEscrow(jobId) {
      const token = localStorage.getItem('access_token');
      const res = await fetch(`${API_BASE}/payments/escrow/${jobId}/release/`, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${token}` }
      });
      const data = await res.json();
      if (res.ok) {
        alert('Payment Released to Worker! 🎉 Net transfer completed.');
        setTab('home');
      } else {
        alert(data.error || 'Failed to release escrow.');
      }
    }

    // 🛡️ Admin Dashboard
    async function renderAdminDashboard() {
      const body = document.getElementById('appBody');
      const token = localStorage.getItem('access_token');
      const res = await fetch(`${API_BASE}/jobs/admin-stats/`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      const stats = await res.json();

      body.innerHTML = `
        <h3 style="margin-bottom:12px; font-weight:800;">Platform Admin Overview</h3>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
          <div class="card" style="text-align:center;">
            <div style="font-size:24px; font-weight:800; color:var(--primary);">${stats.total_users || 0}</div>
            <div class="subtext">Total Users</div>
          </div>
          <div class="card" style="text-align:center;">
            <div style="font-size:24px; font-weight:800; color:var(--primary);">${stats.total_jobs || 0}</div>
            <div class="subtext">Total Jobs</div>
          </div>
          <div class="card" style="text-align:center;">
            <div style="font-size:24px; font-weight:800; color:var(--secondary);">₹${stats.total_escrow_held || 0}</div>
            <div class="subtext">Escrow Held</div>
          </div>
          <div class="card" style="text-align:center;">
            <div style="font-size:24px; font-weight:800; color:var(--accent);">₹${stats.total_escrow_released || 0}</div>
            <div class="subtext">Escrow Released</div>
          </div>
        </div>
      `;
    }
  </script>
</body>
</html>
